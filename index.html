<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบประเมินสื่อการสอนคณิตศาสตร์ McDonald's</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--main:#6c5ce7;--accent:#fd79a8;--text:#2d2a4a;--muted:#7b7796}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Prompt',sans-serif;color:var(--text);padding:16px;min-height:100vh;
    background:linear-gradient(135deg,#f5f3ff 0%,#ffe9f3 100%)}
  .wrap{max-width:680px;margin:0 auto}
  header{text-align:center;padding:20px 8px}
  header h1{font-size:1.35rem;margin:6px 0 4px}
  header p{color:var(--muted);font-size:.9rem;margin:0;line-height:1.6}
  .progress{position:sticky;top:8px;z-index:5;height:8px;border-radius:8px;overflow:hidden;
    background:rgba(255,255,255,.8);backdrop-filter:blur(8px);margin-bottom:16px}
  .progress div{height:100%;width:0;background:linear-gradient(90deg,var(--main),var(--accent));transition:width .4s}
  .card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;
    box-shadow:0 8px 24px rgba(108,92,231,.08);animation:up .5s both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}}
  .card h2{font-size:1.05rem;margin:0 0 6px;color:var(--main)}
  label.q{display:block;font-weight:600;margin:16px 0 8px;font-size:.95rem;line-height:1.5}
  label.q small{font-weight:400;color:var(--muted)}
  input[type=text],textarea{width:100%;padding:12px 14px;border:2px solid #e6e2ff;border-radius:12px;
    font:inherit;font-size:16px;transition:border-color .2s}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--main)}
  textarea{min-height:90px;resize:vertical}
  .opt{position:relative;display:block;cursor:pointer}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt span{display:block;padding:12px 14px;border:2px solid #e6e2ff;border-radius:12px;
    transition:transform .15s,background .2s,border-color .2s;font-size:.95rem}
  .opt span:active{transform:scale(.97)}
  .opt input:checked+span{border-color:var(--main);background:#f0edff;font-weight:600;
    box-shadow:0 4px 12px rgba(108,92,231,.2)}
  .opts{display:grid;gap:8px}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .scale .opt span{text-align:center;padding:10px 2px;font-size:1.25rem;font-weight:700;line-height:1.3}
  .scale .opt small{display:block;font-size:.62rem;font-weight:400;color:var(--muted);margin-top:4px;line-height:1.2}
  .submit{width:100%;padding:16px;border:0;border-radius:16px;font:inherit;font-size:1.05rem;font-weight:700;
    color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--main),var(--accent));
    box-shadow:0 10px 24px rgba(253,121,168,.35);transition:transform .15s}
  .submit:active{transform:scale(.98)}
  .submit:disabled{opacity:.6}
  #done{text-align:center}
  #done h2{font-size:1.4rem}
  .bit{position:fixed;top:-10%;font-size:24px;pointer-events:none;animation:fall 2.8s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="font-size:44px">🍟📚</div>
    <h1>แบบลงทะเบียนและประเมินความพึงพอใจ</h1>
    <p>นิทรรศการสื่อการสอน รายวิชา CEE3403<br>
    สื่อการสอนคณิตศาสตร์ เรื่อง McDonald's การบวกจำนวนนับไม่เกิน 100 (ป.2)</p>
  </header>

  <div class="progress"><div id="bar"></div></div>

  <form id="f">
    <div class="card">
      <h2>ส่วนที่ 1 : ข้อมูลทั่วไปของผู้ประเมิน</h2>
      <label class="q">ชื่อ - นามสกุล</label>
      <input type="text" name="name" required placeholder="เช่น สมหญิง ใจดี">
      <label class="q">รหัสนักศึกษา <small>(อาจารย์/บุคคลภายนอกเว้นว่าง หรือใส่ - ได้)</small></label>
      <input type="text" name="studentId" placeholder="เช่น 6501234567">
      <label class="q">ท่านเข้าร่วมชมนิทรรศการในฐานะใด?</label>
      <div class="opts" id="roles"></div>
    </div>

    <div id="sections"></div>

    <div class="card">
      <h2>ส่วนที่ 3 : ข้อเสนอแนะเพิ่มเติม</h2>
      <label class="q">จุดเด่นของผลงานสื่อการสอนชิ้นนี้ <small>(ไม่บังคับ)</small></label>
      <textarea name="strengths"></textarea>
      <label class="q">ข้อเสนอแนะเพื่อการปรับปรุงและพัฒนาต่อไป <small>(ไม่บังคับ)</small></label>
      <textarea name="suggestions"></textarea>
    </div>

    <button class="submit" id="btn" type="submit">ส่งแบบประเมิน 🚀</button>
  </form>

  <div id="done" class="card" hidden>
    <div style="font-size:56px">🎉</div>
    <h2>ขอบคุณค่ะ!</h2>
    <p>ความคิดเห็นของท่านถูกบันทึกเรียบร้อยแล้ว</p>
  </div>
</div>

<script>
  // ====== ใส่ Web app URL จาก Apps Script ตรงนี้ ======
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6RGIJYPbovpg_IZFEgRsFnZWWfqnzZ86Vxe3jyZvv8S9KM2OPJu4nmkphsW_GIOBJ/exec';

  const roles = [
    ['teacher','อาจารย์ผู้สอน / คณะกรรมการประเมิน'],
    ['student','นักศึกษา'],
    ['general','บุคลากร / ผู้สนใจทั่วไป']
  ];
  const sections = [
    {title:'ส่วนที่ 2 : ด้านเนื้อหาและการนำไปใช้จัดการเรียนรู้', items:[
      ['q1','ความถูกต้องของเนื้อหาเรื่องการบวกจำนวนนับไม่เกิน 100 และความเหมาะสมกับระดับชั้นประถมศึกษาปีที่ 2'],
      ['q2','การเชื่อมโยงสถานการณ์จำลอง (ร้าน McDonald\'s) ช่วยให้ผู้เรียนเข้าใจแนวคิดการบวกได้ง่ายขึ้น'],
      ['q3','สื่อการสอนสามารถดึงดูดความสนใจ กระตุ้นการมีส่วนร่วม และสร้างความสนุกสนานในการเรียนรู้'],
      ['q4','สามารถนำไปประยุกต์ใช้จัดกิจกรรมการเรียนรู้ในชั้นเรียนจริงได้อย่างมีประสิทธิภาพ']
    ]},
    {title:'ด้านการออกแบบ รูปลักษณ์ และคุณภาพของสื่อ', items:[
      ['q5','ความสวยงาม ความคิดสร้างสรรค์ และการใช้สีสัน/ภาพประกอบที่ดึงดูดสายตาผู้เรียน'],
      ['q6','ขนาดของตัวอักษร ตัวเลข และองค์ประกอบของสื่อมีความชัดเจน อ่านง่าย'],
      ['q7','ความแข็งแรง ทนทาน ความปลอดภัย และความสะดวกในการหยิบจับหรือใช้งานของเด็กประถม']
    ]}
  ];
  const scaleLabels = [
    [5,'😍','มากที่สุด'],[4,'🙂','มาก'],[3,'😐','ปานกลาง'],[2,'🙁','น้อย'],[1,'😞','น้อยที่สุด']
  ];

  const $ = s => document.querySelector(s);
  const form = $('#f');

  // ----- สร้างหน้าฟอร์ม -----
  $('#roles').innerHTML = roles.map(([v,t]) =>
    `<label class="opt"><input type="radio" name="role" value="${v}" required><span>${t}</span></label>`
  ).join('');

  $('#sections').innerHTML = sections.map(sec => `
    <div class="card">
      <h2>${sec.title}</h2>
      ${sec.items.map(([k,t]) => `
        <label class="q">${t}</label>
        <div class="scale">
          ${scaleLabels.map(([v,e,l]) => `
            <label class="opt"><input type="radio" name="${k}" value="${v}" required>
            <span>${e}<br>${v}<small>${l}</small></span></label>`).join('')}
        </div>`).join('')}
    </div>`).join('');

  // ----- เสียงลูกเล่น (Web Audio ไม่ต้องใช้ไฟล์เสียง) -----
  let ac;
  function beep(freq = 660, dur = .12) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.15, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  // ----- ความคืบหน้า -----
  const requiredNames = [...new Set([...form.querySelectorAll('[required]')].map(i => i.name))];
  function progress() {
    const done = requiredNames.filter(n => form.elements.namedItem(n).value.trim() !== '').length;
    $('#bar').style.width = (done / requiredNames.length * 100) + '%';
  }

  // ----- ตอบเมื่อเลือก: มีเสียงและอัปเดตความคืบหน้า -----
  form.addEventListener('change', e => {
    if (e.target.type === 'radio' && /^q\d$/.test(e.target.name)) {
      beep(300 + Number(e.target.value) * 110); // คะแนนสูง = เสียงสูง
    } else if (e.target.type === 'radio') {
      beep(520, .08);
    }
    progress();
  });
  form.addEventListener('input', progress);

  // ----- ฉลองเมื่อส่งสำเร็จ -----
  function celebrate() {
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('span');
      s.className = 'bit';
      s.textContent = ['🎉','✨','🍟','🎈'][i % 4];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = Math.random() * .6 + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 3500);
    }
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .2), i * 120));
  }

  // ----- ส่งข้อมูล -----
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(form);
    const scores = {};
    for (let i = 1; i <= 7; i++) scores['q' + i] = Number(fd.get('q' + i));

    const payload = {
      name: fd.get('name').trim(),
      studentId: (fd.get('studentId') || '').trim() || '-',
      role: roles.find(r => r[0] === fd.get('role'))[1],
      scores,
      strengths: fd.get('strengths') || '',
      suggestions: fd.get('suggestions') || ''
    };

    const btn = $('#btn');
    btn.disabled = true; btn.textContent = 'กำลังส่ง...';
    try {
      // no-cors: ส่งข้อมูลได้แม้อ่านคำตอบกลับไม่ได้
      await fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
      form.hidden = true;
      $('#done').hidden = false;
      celebrate();
      window.scrollTo({top: 0, behavior: 'smooth'});
    } catch (err) {
      btn.disabled = false; btn.textContent = 'ส่งแบบประเมิน 🚀';
      alert('ส่งไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้งค่ะ');
    }
  });
</script>
</body>
</html>
